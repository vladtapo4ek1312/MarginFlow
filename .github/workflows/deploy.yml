name: Deploy to GitHub Pages

# Сайт публикуется из ветки gh-pages: каждый пуш в main проверяет код,
# собирает его и обновляет эту ветку. GitHub Pages раздаёт её содержимое.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Права только на запись в репозиторий — чтобы обновить ветку gh-pages.
permissions:
  contents: write

# Один деплой за раз; новый пуш не прерывает уже идущую публикацию.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Включает проверку типов (tsc -b).
      - name: Build
        run: npm run build

      - name: Publish to gh-pages branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
